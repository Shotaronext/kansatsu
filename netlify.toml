[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# 前の住所（netlify.app）は独自ドメインへ
[[redirects]]
  from = "https://friendly-daffodil-06efc0.netlify.app/*"
  to = "https://shotaronext.com/:splat"
  status = 301
  force = true

# About ページは記事「定点」になった
[[redirects]]
  from = "/about/"
  to = "/"  # 「定点」を非公開にしているあいだはトップへ。戻したら /posts/teiten/ に
  status = 301

[[redirects]]
  from = "/:lang/about/"
  to = "/:lang/"
  status = 301
